<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>My Trips — TravelEase</title><link rel="stylesheet" href="css/style.css"/></head>
<body>
<div class="cursor"><div class="cursor-dot" style="position:fixed"></div></div>
<div class="cursor"><div class="cursor-ring" style="position:fixed"></div></div>
<nav class="navbar scrolled"><a href="index.html" class="logo">Travel<span>Ease</span></a><ul class="nav-links"><li><a href="packages.html">Destinations</a></li><ul id="navAuth" style="display:contents"></ul></ul></nav>
<div style="height:72px"></div>
<div class="container" style="padding-top:2.5rem">
  <div style="margin-bottom:2rem"><div class="section-label">✦ Your Journey</div><h2 class="section-title">My <em>Bookings</em></h2></div>
  <div id="bookingsList"></div>
</div>
<script src="js/app.js"></script>
<script>
if(!getToken()){window.location.href='login.html'}
async function load(){
  const {data}=await apiFetch('/api/bookings/my')
  const el=document.getElementById('bookingsList')
  if(!data.success||!data.bookings.length){
    el.innerHTML=`<div class="empty-state"><h3>No trips yet</h3><p>Your booked adventures will appear here</p><a href="packages.html" class="btn btn-gold" style="margin-top:1.5rem">Browse Destinations</a></div>`
    return
  }
  el.innerHTML='<div class="booking-list">'+data.bookings.map(b=>`
    <div class="booking-card reveal">
      <div class="booking-icon">✈</div>
      <div class="booking-info">
        <h3>${b.package?.title||'Package'}</h3>
        <p>📍 ${b.package?.destination||''} · ⏱ Travel: ${fmtDate(b.travelDate)}</p>
        <p>👥 ${b.numberOfSeats} seat(s) · 💰 ${fmt(b.totalAmount)}</p>
        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.25rem">Booked ${fmtDate(b.createdAt)}</p>
      </div>
      <div class="booking-actions">
        <span class="status-badge status-${b.status}">${b.status}</span>
        ${b.status!=='cancelled'?`<button class="btn btn-danger btn-sm" onclick="cancel('${b._id}')">Cancel</button>`:''}
        <a href="reviews.html?pkg=${b.package?._id}&title=${encodeURIComponent(b.package?.title||'')}" class="btn btn-ghost btn-sm">Review</a>
      </div>
    </div>
  `).join('')+'</div>'
  initReveal()
}
async function cancel(id){
  if(!confirm('Cancel this booking?'))return
  const{data}=await apiFetch(`/api/bookings/${id}`,{method:'DELETE'})
  if(data.success)load()
  else alert(data.message)
}
document.addEventListener('DOMContentLoaded',load)
</script>
</body></html>
