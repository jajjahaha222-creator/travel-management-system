<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — TravelEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">✈ TravelEase</a>
  <ul class="nav-links">
    <li><a href="packages.html">Packages</a></li>
    <li><a href="bookings.html">My Bookings</a></li>
    <li id="authSection"></li>
  </ul>
</nav>

<div class="container">
  <div class="section-header">
    <h2>My Bookings</h2>
    <a href="packages.html" class="btn btn-primary btn-sm">Book More</a>
  </div>
  
  <div id="bookingsList">
    <div class="loading">Loading your bookings...</div>
  </div>
</div>

<footer><p>© 2025 TravelEase</p></footer>

<script>
  const token = localStorage.getItem('token')
  const user = JSON.parse(localStorage.getItem('user') || 'null')

  // Redirect to login if not logged in
  if (!token) {
    alert('Please login to view your bookings')
    window.location.href = 'login.html'
  }

  // Navbar
  document.getElementById('authSection').innerHTML = `
    <span style="color:#ccc;font-size:0.9rem">Hi, ${user?.name}</span>
    <button onclick="logout()" class="btn btn-outline btn-sm" style="margin-left:10px">Logout</button>
  `

  function logout() {
    localStorage.removeItem('token')
    localStorage.removeItem('user')
    window.location.href = 'index.html'
  }

  // ── LOAD BOOKINGS ─────────────────────────────────────────────────
  async function loadBookings() {
    try {
      const response = await fetch('/api/bookings/my', {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      const data = await response.json()
      const container = document.getElementById('bookingsList')

      if (!data.success || data.bookings.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No bookings yet</h3>
            <p>You haven't booked any trips yet.</p>
            <a href="packages.html" class="btn btn-primary" style="margin-top:1rem">Browse Packages</a>
          </div>
        `
        return
      }

      container.innerHTML = data.bookings.map(booking => {
        const travelDate = new Date(booking.travelDate).toLocaleDateString('en-IN', {
          day: 'numeric', month: 'long', year: 'numeric'
        })
        const bookedDate = new Date(booking.createdAt).toLocaleDateString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric'
        })

        return `
          <div class="booking-card">
            <div class="booking-info">
              <h3>${booking.package?.title || 'Package Deleted'}</h3>
              <p>📍 ${booking.package?.destination || 'N/A'}</p>
              <p>✈ Travel Date: <strong>${travelDate}</strong></p>
              <p>👥 Seats: ${booking.numberOfSeats} &nbsp;|&nbsp; 💰 Total: ₹${booking.totalAmount.toLocaleString()}</p>
              <p style="font-size:0.8rem;color:#999;margin-top:0.3rem">Booked on: ${bookedDate}</p>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
              <span class="booking-status status-${booking.status}">${booking.status.toUpperCase()}</span>
              ${booking.status !== 'cancelled' ? `
                <button class="btn btn-danger btn-sm" onclick="cancelBooking('${booking._id}')">
                  Cancel
                </button>
              ` : ''}
            </div>
          </div>
        `
      }).join('')
    } catch (error) {
      document.getElementById('bookingsList').innerHTML = 
        '<div class="empty-state"><h3>Error loading bookings</h3></div>'
    }
  }

  // ── CANCEL BOOKING ─────────────────────────────────────────────────
  async function cancelBooking(id) {
    if (!confirm('Are you sure you want to cancel this booking? The seats will be restored.')) return

    try {
      const response = await fetch(`/api/bookings/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      })
      const data = await response.json()
      
      if (data.success) {
        alert('Booking cancelled successfully.')
        loadBookings()
      } else {
        alert(data.message)
      }
    } catch (error) {
      alert('Error cancelling booking')
    }
  }

  loadBookings()
</script>
</body>
</html>
