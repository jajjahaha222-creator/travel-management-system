<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Packages — TravelEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">✈ TravelEase</a>
  <ul class="nav-links" id="navLinks">
    <li><a href="packages.html">Packages</a></li>
    <li><a href="bookings.html">My Bookings</a></li>
    <li id="authSection"><a href="login.html" class="btn btn-outline btn-sm">Login</a></li>
  </ul>
</nav>

<div class="container">
  <div class="section-header">
    <h2>All Travel Packages</h2>
    <!-- Admin-only button — shown only when user.role === 'admin' -->
    <button class="btn btn-primary btn-sm" id="addPackageBtn" 
      style="display:none" onclick="openAddModal()">
      + Add Package
    </button>
  </div>

  <div id="packagesList" class="card-grid">
    <div class="loading">Loading packages...</div>
  </div>
</div>

<!-- BOOKING MODAL -->
<div class="modal-overlay" id="bookingModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('bookingModal')">×</button>
    <h2>Book This Package</h2>
    
    <div id="modalPackageInfo" style="background:#f8f9fa;padding:1rem;border-radius:8px;margin-bottom:1.5rem">
    </div>

    <div class="alert alert-error" id="bookingError"></div>
    <div class="alert alert-success" id="bookingSuccess"></div>

    <div class="form-group">
      <label>Number of Seats</label>
      <input type="number" id="numSeats" min="1" value="1" />
    </div>
    <div class="form-group">
      <label>Travel Date</label>
      <input type="date" id="travelDate" />
    </div>
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:1rem;color:#1a1a2e">
      Total: ₹<span id="totalAmount">0</span>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="confirmBooking()">
      Confirm Booking
    </button>
  </div>
</div>

<!-- ADD PACKAGE MODAL (Admin Only) -->
<div class="modal-overlay" id="addPackageModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('addPackageModal')">×</button>
    <h2>Add New Package</h2>
    
    <div class="alert alert-error" id="addPackageError"></div>

    <div class="form-group">
      <label>Package Title</label>
      <input type="text" id="pkgTitle" placeholder="e.g., Golden Triangle Tour" />
    </div>
    <div class="form-group">
      <label>Destination</label>
      <input type="text" id="pkgDestination" placeholder="e.g., Delhi, Agra, Jaipur" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="pkgDescription" placeholder="Describe the package..."></textarea>
    </div>
    <div class="form-group">
      <label>Duration (days)</label>
      <input type="number" id="pkgDuration" min="1" placeholder="7" />
    </div>
    <div class="form-group">
      <label>Price per person (₹)</label>
      <input type="number" id="pkgPrice" min="0" placeholder="25000" />
    </div>
    <div class="form-group">
      <label>Available Seats</label>
      <input type="number" id="pkgSeats" min="1" placeholder="20" />
    </div>
    <div class="form-group">
      <label>Image URL (optional)</label>
      <input type="url" id="pkgImage" placeholder="https://..." />
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="addPackage()">Add Package</button>
  </div>
</div>

<footer><p>© 2025 TravelEase</p></footer>

<script>
  const token = localStorage.getItem('token')
  const user = JSON.parse(localStorage.getItem('user') || 'null')
  let selectedPackage = null

  // ── NAVBAR AUTH ────────────────────────────────────────────────────
  if (token && user) {
    document.getElementById('authSection').innerHTML = `
      <span style="color:#ccc;font-size:0.9rem">Hi, ${user.name}</span>
      <button onclick="logout()" class="btn btn-outline btn-sm" style="margin-left:10px">Logout</button>
    `
    // Show Add Package button to admins
    if (user.role === 'admin') {
      document.getElementById('addPackageBtn').style.display = 'inline-block'
    }
  }

  function logout() {
    localStorage.removeItem('token')
    localStorage.removeItem('user')
    window.location.href = 'index.html'
  }

  // ── LOAD PACKAGES ─────────────────────────────────────────────────
  async function loadPackages() {
    try {
      const response = await fetch('/api/packages')
      const data = await response.json()
      const container = document.getElementById('packagesList')

      if (!data.success || data.packages.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No packages available</h3><p>Check back soon!</p></div>'
        return
      }

      container.innerHTML = data.packages.map(pkg => `
        <div class="package-card">
          <img src="${pkg.image}" alt="${pkg.title}" 
            onerror="this.src='https://images.unsplash.com/photo-1488085061387-422e29b40080?w=600'" />
          <div class="card-body">
            <h3>${pkg.title}</h3>
            <div class="destination">📍 ${pkg.destination}</div>
            <p style="font-size:0.85rem;color:#666;margin-bottom:0.75rem">
              ${pkg.description.substring(0, 120)}${pkg.description.length > 120 ? '...' : ''}
            </p>
            <div class="card-meta">
              <span>⏱ ${pkg.duration} days</span>
              <span class="seats">✓ ${pkg.availableSeats} seats left</span>
            </div>
            <div class="price" style="margin:0.5rem 0">₹${pkg.price.toLocaleString()}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn btn-primary btn-sm" 
                onclick="openBookingModal('${pkg._id}', '${pkg.title}', ${pkg.price}, ${pkg.availableSeats})"
                ${pkg.availableSeats === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>
                ${pkg.availableSeats === 0 ? 'Sold Out' : 'Book Now'}
              </button>
              ${user && user.role === 'admin' ? `
                <button class="btn btn-danger btn-sm" onclick="deletePackage('${pkg._id}')">Delete</button>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('')
    } catch (error) {
      document.getElementById('packagesList').innerHTML = 
        '<div class="empty-state"><h3>Error loading packages</h3></div>'
    }
  }

  // ── BOOKING MODAL ─────────────────────────────────────────────────
  function openBookingModal(id, title, price, availableSeats) {
    if (!token) {
      alert('Please login first to book a package!')
      window.location.href = 'login.html'
      return
    }

    selectedPackage = { id, title, price, availableSeats }
    
    document.getElementById('modalPackageInfo').innerHTML = `
      <strong>${title}</strong><br>
      <span style="color:#666;font-size:0.9rem">₹${price.toLocaleString()} per person • ${availableSeats} seats available</span>
    `
    
    // Set minimum date to tomorrow
    const tomorrow = new Date()
    tomorrow.setDate(tomorrow.getDate() + 1)
    document.getElementById('travelDate').min = tomorrow.toISOString().split('T')[0]
    
    document.getElementById('numSeats').value = 1
    document.getElementById('totalAmount').textContent = price.toLocaleString()
    
    document.getElementById('bookingModal').classList.add('active')
  }

  // Update total when seats change
  document.getElementById('numSeats')?.addEventListener('input', function () {
    if (selectedPackage) {
      const total = this.value * selectedPackage.price
      document.getElementById('totalAmount').textContent = total.toLocaleString()
    }
  })

  async function confirmBooking() {
    const seats = parseInt(document.getElementById('numSeats').value)
    const travelDate = document.getElementById('travelDate').value

    if (!travelDate) {
      return showModalAlert('bookingError', 'Please select a travel date')
    }
    if (seats < 1 || seats > selectedPackage.availableSeats) {
      return showModalAlert('bookingError', `Please enter between 1 and ${selectedPackage.availableSeats} seats`)
    }

    try {
      const response = await fetch('/api/bookings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`   // Send our JWT token
        },
        body: JSON.stringify({
          packageId: selectedPackage.id,
          numberOfSeats: seats,
          travelDate
        })
      })

      const data = await response.json()

      if (data.success) {
        showModalAlert('bookingSuccess', 'Booking confirmed! Redirecting...', 'success')
        setTimeout(() => {
          closeModal('bookingModal')
          window.location.href = 'bookings.html'
        }, 1500)
      } else {
        showModalAlert('bookingError', data.message)
      }
    } catch (error) {
      showModalAlert('bookingError', 'Connection error')
    }
  }

  // ── ADD PACKAGE (Admin) ───────────────────────────────────────────
  function openAddModal() {
    document.getElementById('addPackageModal').classList.add('active')
  }

  async function addPackage() {
    const title = document.getElementById('pkgTitle').value.trim()
    const destination = document.getElementById('pkgDestination').value.trim()
    const description = document.getElementById('pkgDescription').value.trim()
    const duration = document.getElementById('pkgDuration').value
    const price = document.getElementById('pkgPrice').value
    const availableSeats = document.getElementById('pkgSeats').value
    const image = document.getElementById('pkgImage').value.trim()

    if (!title || !destination || !description || !duration || !price || !availableSeats) {
      return showModalAlert('addPackageError', 'Please fill all required fields')
    }

    try {
      const response = await fetch('/api/packages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ title, destination, description, duration: +duration, price: +price, availableSeats: +availableSeats, image })
      })

      const data = await response.json()

      if (data.success) {
        closeModal('addPackageModal')
        loadPackages()  // Reload the list
      } else {
        showModalAlert('addPackageError', data.message)
      }
    } catch (error) {
      showModalAlert('addPackageError', 'Error adding package')
    }
  }

  // ── DELETE PACKAGE ────────────────────────────────────────────────
  async function deletePackage(id) {
    if (!confirm('Are you sure you want to delete this package?')) return

    try {
      const response = await fetch(`/api/packages/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      })
      const data = await response.json()
      if (data.success) loadPackages()
      else alert(data.message)
    } catch (error) {
      alert('Error deleting package')
    }
  }

  // ── HELPERS ───────────────────────────────────────────────────────
  function closeModal(id) {
    document.getElementById(id).classList.remove('active')
  }

  function showModalAlert(id, message, type = 'error') {
    const el = document.getElementById(id)
    el.textContent = message
    el.className = `alert alert-${type}`
    el.style.display = 'block'
    setTimeout(() => { el.style.display = 'none' }, 4000)
  }

  // Close modal when clicking outside
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('active')
    })
  })

  // Initialize
  loadPackages()
</script>
</body>
</html>
