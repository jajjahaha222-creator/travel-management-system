<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Sign In — TravelEase</title><link rel="stylesheet" href="css/style.css"/>
<style>
.auth-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-visual{background:url('https://images.unsplash.com/photo-1503220317375-aaad61436b1b?w=1200')center/cover;position:relative;display:flex;align-items:flex-end;padding:3rem}
.auth-visual::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,0.85) 0%,rgba(10,10,15,0.2) 100%)}
.auth-visual-text{position:relative;z-index:2}
.auth-visual-text h2{font-family:var(--ff-display);font-size:2.5rem;font-weight:300;line-height:1.2;margin-bottom:0.5rem}
.auth-visual-text h2 em{font-style:italic;color:var(--gold)}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:3rem 2rem;background:var(--dark)}
.auth-form-wrap{width:min(440px,100%)}
@media(max-width:768px){.auth-page{grid-template-columns:1fr}.auth-visual{display:none}}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-visual">
    <div class="auth-visual-text">
      <div class="section-label">✦ Welcome Back</div>
      <h2>Your Next<br/><em>Adventure</em><br/>Awaits</h2>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-form-wrap">
      <a href="index.html" class="logo" style="display:block;margin-bottom:2.5rem">Travel<span>Ease</span></a>

      <div style="display:flex;gap:0.5rem;margin-bottom:2rem">
        <button class="filter-pill active" id="tabLogin" onclick="showTab('login')">Sign In</button>
        <button class="filter-pill" id="tabReg" onclick="showTab('register')">Create Account</button>
      </div>

      <!-- LOGIN -->
      <div id="loginPanel">
        <div class="alert alert-error" id="loginErr"></div>
        <div class="alert alert-success" id="loginOk"></div>
        <div class="form-group"><label>Email</label><input type="email" id="lEmail" placeholder="you@example.com" onkeypress="if(event.key==='Enter')doLogin()"/></div>
        <div class="form-group"><label>Password</label><input type="password" id="lPass" placeholder="Your password" onkeypress="if(event.key==='Enter')doLogin()"/></div>
        <button class="btn btn-gold" style="width:100%;padding:13px" onclick="doLogin()">Sign In</button>
        <p style="text-align:center;margin-top:1rem;font-size:0.82rem;color:var(--text-muted)">
          Demo admin: <code style="color:var(--gold)">admin@travelease.com</code> / <code style="color:var(--gold)">admin1234</code>
        </p>
      </div>

      <!-- REGISTER -->
      <div id="regPanel" style="display:none">
        <div class="alert alert-error" id="regErr"></div>
        <div class="alert alert-success" id="regOk"></div>
        <div class="form-group"><label>Full Name</label><input type="text" id="rName" placeholder="Shruti Solanki"/></div>
        <div class="form-group"><label>Email</label><input type="email" id="rEmail" placeholder="you@example.com"/></div>
        <div class="form-group"><label>Password</label><input type="password" id="rPass" placeholder="Min 6 characters"/></div>
        <button class="btn btn-gold" style="width:100%;padding:13px" onclick="doRegister()">Create Account</button>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
if(getToken()){window.location.href='index.html'}
// Check tab param
if(new URLSearchParams(location.search).get('tab')==='register') showTab('register')

function showTab(t){
  document.getElementById('loginPanel').style.display = t==='login'?'block':'none'
  document.getElementById('regPanel').style.display   = t==='register'?'block':'none'
  document.getElementById('tabLogin').classList.toggle('active', t==='login')
  document.getElementById('tabReg').classList.toggle('active', t==='register')
}

async function doLogin(){
  const email=document.getElementById('lEmail').value.trim()
  const password=document.getElementById('lPass').value
  if(!email||!password)return showAlert('loginErr','Please fill all fields')
  const{data}=await apiFetch('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})})
  if(data.success){
    setAuth(data.token,data.user)
    showAlert('loginOk','Welcome back! Redirecting…','success')
    setTimeout(()=>window.location.href='packages.html',1000)
  } else showAlert('loginErr',data.message)
}

async function doRegister(){
  const name=document.getElementById('rName').value.trim()
  const email=document.getElementById('rEmail').value.trim()
  const password=document.getElementById('rPass').value
  if(!name||!email||!password)return showAlert('regErr','Please fill all fields')
  if(password.length<6)return showAlert('regErr','Password must be at least 6 characters')
  const{data}=await apiFetch('/api/auth/register',{method:'POST',body:JSON.stringify({name,email,password})})
  if(data.success){
    setAuth(data.token,data.user)
    showAlert('regOk','Account created! Redirecting…','success')
    setTimeout(()=>window.location.href='packages.html',1000)
  } else showAlert('regErr',data.message)
}
</script>
</body></html>
